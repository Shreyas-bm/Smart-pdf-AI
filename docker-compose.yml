version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart_pdf_db
    restart: always
    environment:
      POSTGRES_USER: smart_pdf_user
      POSTGRES_PASSWORD: smart_pdf_password
      POSTGRES_DB: smart_pdf_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart_pdf_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
